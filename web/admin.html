<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知识库管理后台</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#f5f7fa;color:#1f2937;padding:16px}
  h1{font-size:18px;margin-bottom:12px}
  .card{background:#fff;border-radius:12px;padding:16px;margin-bottom:14px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
  .card h3{font-size:14px;margin-bottom:10px;color:#374151}
  label{font-size:13px;display:block;margin:6px 0 4px}
  select,input[type=file],input[type=text]{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:8px;font-size:14px}
  button{background:#16a34a;color:#fff;border:none;padding:9px 14px;border-radius:8px;font-size:14px;cursor:pointer;margin-top:8px}
  .row{display:flex;gap:8px;align-items:center}
  pre{background:#f8fafc;border:1px solid #e5e7eb;border-radius:8px;padding:10px;font-size:12px;overflow:auto;white-space:pre-wrap}
  .stat{display:inline-block;background:#dcfce7;color:#15803d;border-radius:8px;padding:6px 12px;font-size:13px;margin:4px 6px 4px 0}
  .status{font-size:12px;color:#9ca3af;margin-top:6px}
</style>
</head>
<body>
<h1>⚙️ 知识库管理后台</h1>

<div class="card">
  <h3>📊 知识库统计</h3>
  <div id="stats"></div>
</div>

<div class="card">
  <h3>🧬 本体建模（类 + Is-A 类别层级 + 关系）</h3>
  <div id="ontology"></div>
</div>

<div class="card">
  <h3>🗺️ 企业本体大图（本体实例 · 力导向）</h3>
  <div id="biggraph" style="height:520px;overflow:auto;border:1px solid #e5e7eb;border-radius:8px;background:#fff"></div>
</div>

<div class="card">
  <h3>📤 上传数据（CSV → 重建本体）</h3>
  <label>目标表</label>
  <select id="table">
    <option value="products">products 产品</option>
    <option value="raw_materials">raw_materials 原料/零部件</option>
    <option value="batches">batches 批次</option>
    <option value="ingredient">ingredient 批次-原料</option>
    <option value="qc">qc 质检</option>
    <option value="equipment">equipment 设备</option>
  </select>
  <label>CSV 文件</label>
  <input type="file" id="file" accept=".csv">
  <button onclick="upload()">上传并重建</button>
  <div id="up-status" class="status"></div>
</div>

<div class="card">
  <h3>🧠 当前词典（config/lexicon_*.json）</h3>
  <pre id="lexicon">加载中…</pre>
</div>

<div class="card">
  <h3>📋 最近审计日志</h3>
  <pre id="audit">加载中…</pre>
</div>

<script src="https://cdn.bootcdn.net/ajax/libs/echarts/5.5.0/echarts.min.js"></script>
<script>
const BASE='';
async function j(u){const r=await fetch(BASE+u);const d=await r.json();if(!r.ok)throw new Error(d.detail||d.error||('HTTP '+r.status));return d;}
async function load(){
  try{
    const s=await j('/api/stats');
    el('stats').innerHTML=Object.entries(s).filter(([k])=>typeof s[k]==='number').map(([k,v])=>`<span class="stat">${k}: ${v}</span>`).join('');
  }catch(e){el('stats').textContent='加载失败: '+e.message;}
  try{
    const d=await j('/api/app-config');
    el('lexicon').textContent=JSON.stringify({kb:d.kb,name:d.name,examples:d.examples},null,2);
  }catch(e){el('lexicon').textContent='加载失败: '+e.message;}
  try{
    const d=await j('/api/admin/audit?limit=20');
    el('audit').textContent=JSON.stringify(d.audit||[],null,2);
  }catch(e){el('audit').textContent='加载失败(需admin Key?): '+e.message;}
  try{
    const o=await j('/api/ontology/structure');
    el('ontology').innerHTML=
      `<div style="margin-bottom:8px"><span class="stat">实例 ${o.instance_total}</span><span class="stat">类 ${o.classes.length}</span><span class="stat">关系 ${o.object_properties.length}</span></div>`+
      `<b style="font-size:13px">类：</b><div style="font-size:12px;margin:4px 0">${o.classes.map(c=>'<span style="background:#eef2ff;padding:2px 8px;border-radius:6px;margin:2px 4px;display:inline-block">'+c+'</span>').join('')}</div>`+
      `<b style="font-size:13px">Is-A 类别层级(subClassOf)：</b><div style="font-size:12px;margin:4px 0">${o.subclass_of.map(([s,p])=>'<span style="background:#ecfdf5;padding:2px 8px;border-radius:6px;margin:2px 4px;display:inline-block">'+s+' → '+p+'</span>').join('')||'无'}</div>`+
      `<b style="font-size:13px">对象属性关系：</b><div style="font-size:12px;margin:4px 0">${o.object_properties.join(' · ')}</div>`;
  }catch(e){el('ontology').textContent='加载失败: '+e.message;}
  try{
    const o=await j('/api/ontology/graph');
    if(typeof echarts!=='undefined'){
      const chartEl=el('biggraph');
      const colors={Food_products:'#2f6bff',Food_raw_materials:'#27ae60',Food_batches:'#f39c12',Food_batch_ingredient:'#e67e22',Food_qc:'#e74c3c',Food_equipment:'#16a085',Food:'#8e44ad'};
      const cats=[...new Set(o.nodes.map(n=>n.entity))].map(e=>({name:e}));
      const chart=echarts.init(chartEl);
      chart.setOption({tooltip:{show:true},animationDuration:800,
        series:[{type:'graph',layout:'force',roam:true,
          force:{repulsion:280,edgeLength:[50,120],gravity:0.1},
          label:{show:true,position:'right',fontSize:9,formatter:p=>p.name&&p.name.split('#').pop().split('_').pop()},
          edgeSymbol:['none','arrow'],lineStyle:{color:'#d6e4ff',width:1},
          categories:cats,
          data:o.nodes.map(n=>({id:n.id,name:n.name,entity:n.entity,
            category:cats.findIndex(c=>c.name===n.entity),
            itemStyle:{color:colors[n.entity]||'#7f8c8d'}})),
          links:o.edges.map(e=>({source:e.from,target:e.to,label:{show:false}})),
          emphasis:{focus:'adjacency',label:{show:true,fontSize:11}}
        }]});
    } else {
      el('biggraph').textContent='ECharts 未加载(CDN需网络)';
    }
  }catch(e){el('biggraph').textContent='大图加载失败: '+e.message;}
}
async function upload(){
  const f=el('file').files[0]; if(!f){el('up-status').textContent='请选CSV';return;}
  const fd=new FormData(); fd.append('file',f);
  const table=el('table').value;
  try{
    const r=await fetch(BASE+'/api/admin/upload?table='+table,{method:'POST',body:fd});
    const d=await r.json();
    el('up-status').textContent = r.ok ? `✅ 上传 ${d.file} → ${d.table}, 本体节点 ${d.nodes}` : ('❌ '+ (d.detail||d.error));
    if(r.ok) load();
  }catch(e){el('up-status').textContent='❌ '+e.message;}
}
function el(id){return document.getElementById(id);}
load();
</script>
</body>
</html>
