# 食品企业知识库 — 一键部署
# 用法: docker compose up -d
# 访问: http://<服务器IP>:8000  (APP + API 同端口)
# 鉴权: 设环境变量 FOOD_ADMIN_KEY / FOOD_READ_KEY 后 /api/* 需 X-API-Key 头
services:
  api:
    build: .
    container_name: food-kb-api
    ports:
      - "8000:8000"
    environment:
      # 角色化鉴权(可选; 不设则内网开放)
      - FOOD_ADMIN_KEY=${FOOD_ADMIN_KEY:-}
      - FOOD_READ_KEY=${FOOD_READ_KEY:-}
    restart: unless-stopped
    volumes:
      # 挂载数据目录: 放真实(脱敏)食品 CSV, 重启自动增量重建
      - ./codes/data:/app/codes/data
      - ./codes/output:/app/codes/output

  # HTTPS 反向代理(可选, 配好证书后启用)
